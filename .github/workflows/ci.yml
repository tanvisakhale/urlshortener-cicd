name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check app tests

      - name: Run tests
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

      - name: Build Docker image
        run: docker build -t url-shortener:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "url-shortener:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0" # fail the build on critical/high CVEs

      - name: Scan dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt || true # non-blocking; review report
