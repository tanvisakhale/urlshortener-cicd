apiVersion: v1
kind: ConfigMap
metadata:
  name: url-shortener-config
data:
  # Sane local-dev fallback defaults only. In staging/production these
  # are overridden by the same-named keys in url-shortener-secret (env
  # vars from a later envFrom entry win over an earlier one -- see
  # deployment.yaml), which the CD pipeline populates from the real
  # Terraform-provisioned RDS instance at deploy time. Nothing
  # environment-specific is hard-coded here.
  DATABASE_PORT: "5432"
  DATABASE_NAME: "urlshortener"
