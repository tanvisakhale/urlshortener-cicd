# PLACEHOLDER ONLY -- do not commit real credentials to git, and this
# file is never applied as-is against staging/production.
#
# In staging and production, the CD pipeline (.github/workflows/cd.yml,
# step "Fetch RDS connection info and update Kubernetes Secret") replaces
# this Secret entirely at every deploy:
#   1. It looks up the real RDS instance via `aws rds describe-db-instances`
#      (Terraform output terraform/outputs.tf: rds_instance_identifier).
#   2. It reads the AWS-managed master-user secret via
#      `aws secretsmanager get-secret-value` (this password was generated
#      by AWS itself -- terraform/rds.tf manage_master_user_password =
#      true -- Terraform and its state never saw the plaintext value).
#   3. It writes DATABASE_HOST/PORT/NAME/USER/PASSWORD into this Secret
#      with `kubectl create secret ... --dry-run=client -o yaml | kubectl
#      apply -f -`.
#
# This file only exists so `kustomize build` / `kubectl apply -k`
# succeed when applied standalone (e.g. against a local kind/minikube
# cluster for learning/demo purposes) without needing real AWS
# credentials. The values below are fake.
apiVersion: v1
kind: Secret
metadata:
  name: url-shortener-secret
type: Opaque
stringData:
  DATABASE_HOST: "REPLACE_ME_RDS_ENDPOINT"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "urlshortener"
  DATABASE_USER: "REPLACE_ME"
  DATABASE_PASSWORD: "REPLACE_ME"
